<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduVerse AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    {% load static %}
    <!-- Custom CSS -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--bg-main);">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                
                <!-- Outer Form Card -->
                <div class="edu-card text-center p-4">
                    
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3 shadow-sm" style="width: 64px; height: 64px;">
                            <i class="fa-solid fa-graduation-cap fs-2"></i>
                        </div>
                        <h2 class="fw-bold mb-1" style="color: var(--text-primary); letter-spacing: -1px;">EduVerse AI</h2>
                        <p class="caption-text text-muted mb-0">Your personal AI learning buddy awaits!</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger border-0 rounded-4 py-2" role="alert" style="font-size: 0.9rem;">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- Form -->
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold text-muted ps-2" style="font-size: 0.85rem;">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Your learning name" required>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold text-muted ps-2" style="font-size: 0.85rem;">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Secret keys" required>
                        </div>

                        <button type="submit" class="btn btn-primary-edu w-100 py-3 mb-3">Let's Go! 🚀</button>
                    </form>

                    <div class="mt-2" style="font-size: 0.9rem;">
                        <span class="text-muted">New here?</span>
                        <a href="{% url 'accounts:signup' %}" class="text-primary fw-bold text-decoration-none ms-1">Create a Profile!</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
